<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Potato Stock & Cold Storage Management</title>
    <meta name="description" content="Enterprise Potato Seed Stock, Production, Cold Storage, Delivery, Reporting & Inventory Management System" />
    <meta property="og:title" content="Potato Stock & Cold Storage Management" />
    <meta property="og:description" content="Enterprise Potato Seed Stock, Production, Cold Storage, Delivery, Reporting & Inventory Management System" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          if (!sessionStorage.getItem('potato_app_session')) {
            sessionStorage.setItem('potato_app_session', 'active');
            localStorage.setItem('potato_theme_name', 'corporate-light');
            localStorage.setItem('potato_theme_mode', 'light');
            localStorage.setItem('app_dashboard_table_density', 'compact');
          }
          var theme = localStorage.getItem('potato_theme_name') || 'corporate-light';
          var mode = localStorage.getItem('potato_theme_mode') || 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
